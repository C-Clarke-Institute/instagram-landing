<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <div class="nav-container">
            <a class="logo" href="#">
                <img src="assets/instagram-logo.png" alt="Instagram">
            </a>

            <nav class="nav-links">
                <a class="nav-link is-active">Features</a>
                <a class="nav-link">Explore</a>
                <a class="nav-link">Stories & Reels</a>
                <a class="nav-link">Community</a>
            </nav>

            <div class="nav-actions">
                <a class="btn btn-primary nav-download">Download App</a>
            </div>
        </div>
    </header>

    <main>
        <section class="hero">
            <div class="hero-grid">
                <div class="hero-content">
                    <span class="availability">Available on Android and IOS</span>
                    <h1 class="hero-title">Share what you love.</h1>
                    <h1 class="hero-content">Connect with freinds.discover new interest, and share the special moments that shape your world every single day.</h1>
                    <span class="download-btn">Download Instagram</span>
                    <span class="explore-btn">Explore Features &rarr;</span>
                </div>
                <div class="hero-phone"></div>
        </section>
        <section class="download"></section>
        <section class="features"></section>
        <section class="app-showcase"></section>
        <section class="stories"></section>
        <section class="community"></section>
        <section class="final-cta"></section>

    </main>
    <footer class="site-footer"></footer>

</body>
</html>
